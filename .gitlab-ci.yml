include:
  - project: earthscope/infrastructure/gitlab-ci
    ref: "$GITLAB_CI_LIB_VERSION"
    file:
      - project-template-image-matrix.yml
    rules:
      - exists:
          - gitlab-ci
        when: never
      - when: always
  - local: gitlab-ci/project-template-image-matrix.yml
    rules:
      - exists:
          - gitlab-ci
        when: always
      - when: never

.images_matrix:
  - DOCKERFILE_RELPATH: "geolab-base"
    DOCKER_EXTRA_OPTIONS: "--build-arg IMAGE_AUTHORS=geolab@earthscope.org --build-arg PYTHON_VERSION=3.12 --build-arg GEOLAB_VERSION=0.10.0"
  # - DOCKERFILE_RELPATH: "geolab-gpu"
  #   DOCKER_EXTRA_OPTIONS: "--build-arg IMAGE_AUTHORS=geolab@earthscope.org --build-arg PYTHON_VERSION=3.12 --build-arg GEOLAB_VERSION=${IMAGE_VERSION} --build-arg NVIDIA_DRIVER_VERSION=580"
  # - DOCKERFILE_RELPATH: "geolab-gpu2"
  #   DOCKER_EXTRA_OPTIONS: "--build-arg IMAGE_AUTHORS=geolab@earthscope.org --build-arg PYTHON_VERSION=3.12 --build-arg GEOLAB_VERSION=${IMAGE_VERSION} --build-arg NVIDIA_DRIVER_VERSION=580"


variables:
  CONTAINER_REGISTRY_PLATFORM: "AWS-PUB"
  DOCKERFILE_RELPATH_IS_IMAGE_NAME: "true"
  GITLAB_HOSTED_RUNNER_SIZE: "saas-linux-medium-amd64"