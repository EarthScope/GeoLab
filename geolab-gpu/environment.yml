channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # --- Jupyter server + extensions ---
  - jupyterhub
  - jupyter_server
  - jupyterlab
  - ipykernel
  - jupyter-resource-usage
  - jupyter-ruff
  - jupyter-server-proxy
  - jupyterlab-git
  - jupyterlab-myst
  - jupyterlab_code_formatter
  - jupyterlab_pygments
  - nbdime
  - nbgitpuller
  # --- Cloud & storage ---
  - awscli
  - awswrangler
  - boto3
  - fsspec
  - obstore
  - s3fs
  # --- Array / data ---
  - numpy
  - scipy
  - pandas
  - polars
  - xarray
  - bottleneck
  - flox
  - h5py
  - netcdf4
  - h5netcdf
  - pyarrow
  - cvxpy
  - zarr
  - virtualizarr
  - numba
  - pooch
  # --- Parallel computing ---
  - dask
  - dask-gateway
  - distributed
  # --- Visualization ---
  - matplotlib-base
  - graphviz
  - pygraphviz
  - ipycytoscape
  - altair
  - hvplot
  - holoviews
  - vegafusion
  - vl-convert-python>=1.9.0
  - plotly
  - ipympl
  - panel
  # --- Interactive widgets ---
  - ipywidgets
  - anywidget
  - bqplot
  - ipytree
  - itables
  - ipydatagrid
  - sidecar
  # --- Geospatial ---
  - cartopy
  - contextily
  - fiona
  - folium
  - gdal
  - geopandas
  - ipyleaflet
  - lonboard
  - pyproj
  - shapely
  # --- Geophysics ---
  - dascore
  - obspy
  - obsplus
  - gmt
  - pygmt
  # --- System / binary tools ---
  - ffmpeg
  - ghostscript  # runtime dep for GMT/pygmt
  # --- Dev tools and utilities ---
  - gh
  - gh-scoped-creds
  - pip
  - pytest
  - pyyaml
  - requests
  - ruff
  - tqdm
  # --- GPU / machine learning ---
  # pytorch itself is NOT installed here -- it's pinned to an exact
  # cu126 pip wheel in requirements.txt to match the NVIDIA driver
  # version baked into this image (see Dockerfile). Installing it via
  # conda too would pull in a second, differently-versioned build.
  - jupyterlab-nvdashboard
  - nvidia-ml-py  # pynvml: GPU utilization/temperature queries, used by test_gpu.py's stress test
  - scikit-learn
  - scikit-image
  - xgboost
  - dask-ml
  - seaborn
  - line_profiler
  - memory_profiler
  - snakeviz
  - watermark
  # networkx is also pulled in transitively by torch itself, but it's
  # declared explicitly here since torch_geometric (requirements.txt)
  # uses it directly as a real dependency, not an implementation detail.
  - networkx
