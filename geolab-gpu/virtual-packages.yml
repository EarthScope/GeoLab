# Virtual packages conda-lock assumes for the build target when solving
# conda-lock.yml: glibc of the pangeo base image (Ubuntu 24.04).
# __cuda is deliberately NOT declared, matching a `docker build`, which
# has no GPU attached: without it, packages with CUDA variants (xgboost,
# pyarrow/libarrow) resolve to their CPU builds, the same as an unlocked
# build of environment.yml would. To lock CUDA builds instead, pin them
# explicitly in environment.yml (e.g. xgboost=*=cuda129*) and add
# `__cuda: "13.0"` below (the max CUDA version NVIDIA_DRIVER_VERSION=580
# supports).
subdirs:
  linux-64:
    packages:
      __glibc: "2.39"
